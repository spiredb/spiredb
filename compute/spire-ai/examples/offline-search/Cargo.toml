[package]
name = "spire-ai-example-offline-search"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline semantic search over local documents"

[workspace]

[dependencies]
spire-ai = { path = "../../" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
chrono = "0.4"
